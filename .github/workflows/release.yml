name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: eightsleep-pager
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: rust
